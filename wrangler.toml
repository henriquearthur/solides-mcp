# Instância remota privada do solides-mcp. Cada pessoa faz o deploy na própria conta;
# o repositório não fixa domínio nem rota.
name = "solides-mcp"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"

# Teto da instalação para a escrita (ADR 0002). Com "true", a tela de autorização mostra a caixa
# "Permitir escrita", desmarcada: cada usuário escolhe na Autorização. Mude para "false" para
# esconder a caixa e nunca registrar as tools de escrita.
[vars]
SOLIDES_ALLOW_WRITES = "true"

# Guarda clientes, Autorizações e tokens do workers-oauth-provider (o nome do binding é fixo).
# Crie com `wrangler kv namespace create OAUTH_KV` e troque o id abaixo.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"
